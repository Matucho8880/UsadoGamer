<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="205 223 390 390" width="512" height="512">
  <defs>
    <g id="pad">
      <rect x="240" y="330" width="320" height="110" rx="55"/>
      <ellipse cx="275" cy="440" rx="48" ry="68" transform="rotate(12 275 440)"/>
      <ellipse cx="525" cy="440" rx="48" ry="68" transform="rotate(-12 525 440)"/>
    </g>
  </defs>

  <!-- contorno negro grueso (legible en tamaños chicos) -->
  <use xlink:href="#pad" href="#pad" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="30" stroke-linejoin="round"/>
  <!-- cuerpo azul -->
  <use xlink:href="#pad" href="#pad" fill="#1347D8"/>

  <!-- cruceta blanca -->
  <rect x="316" y="350" width="26" height="72" rx="7" fill="#FFFFFF"/>
  <rect x="293" y="373" width="72" height="26" rx="7" fill="#FFFFFF"/>
  <!-- botones blancos -->
  <g fill="#FFFFFF">
    <circle cx="480" cy="352" r="19"/>
    <circle cx="480" cy="420" r="19"/>
    <circle cx="446" cy="386" r="19"/>
    <circle cx="514" cy="386" r="19"/>
  </g>
</svg>
